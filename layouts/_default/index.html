{{ define "main" }}
<div class="home">
  <header class="hero">
    <h1>{{ .Title }}</h1>
    <p class="tagline">{{ .Description }}</p>
  </header>

  {{ .Content }}

  <section class="cta">
    <a href="/services-dashboard/" class="button primary">서비스 현황 보기</a>
    <a href="/about/" class="button secondary">소개 보기</a>
  </section>
</div>

<style>
  .home {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    color: #333;
  }
  .hero {
    text-align: center;
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid #eee;
  }
  .hero h1 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    color: #212529;
  }
  .tagline {
    font-size: 1.2rem;
    color: #666;
  }
  .cta {
    display: flex;
    gap: 1rem;
    justify-content: center;
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid #eee;
  }
  .button {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border-radius: 4px;
    text-decoration: none;
    font-weight: 500;
    transition: background-color 0.2s;
  }
  .button.primary {
    background: #007bff;
    color: white;
  }
  .button.primary:hover {
    background: #0056b3;
  }
  .button.secondary {
    background: #6c757d;
    color: white;
  }
  .button.secondary:hover {
    background: #545b62;
  }
</style>
{{ end }}
