{{ define "main" }}
<div class="home">
  <header class="hero">
    <h1>{{ .Title }}</h1>
    <p class="tagline">{{ .Description }}</p>
  </header>

  {{ .Content }}

  <footer class="footer">
    <p>&copy; 2026 (주)플로우. All rights reserved.</p>
  </footer>
</div>

<style>
  .home {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    color: #333;
  }
  .hero {
    text-align: center;
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid #eee;
  }
  .hero h1 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    color: #212529;
    font-weight: 600;
  }
  .tagline {
    font-size: 1.2rem;
    color: #666;
    max-width: 600px;
    margin: 0 auto;
  }
  .footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid #eee;
    font-size: 0.9rem;
    color: #666;
    text-align: center;
  }
</style>
{{ end }}
