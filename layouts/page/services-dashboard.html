{{ define "main" }}
<div class="services-dashboard">
  <header>
    <h1>{{ .Title }}</h1>
    <p>{{ .Description }}</p>
    <p>최종 업데이트: {{ .Lastmod.Format "2006-01-02" }}</p>
  </header>

  {{ .Content }}

  <footer>
    <p>이 페이지는 사람과 agents 모두가 읽을 수 있도록 설계되었습니다.</p>
  </footer>
</div>

<style>
  .services-dashboard header {
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .services-dashboard h1 {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
  }
  .services-dashboard section {
    margin-bottom: 2rem;
  }
  .services-dashboard h2 {
    font-size: 1.3rem;
    margin-bottom: 1rem;
    color: rgba(255,255,255,0.9);
  }
  .services-dashboard ul {
    list-style: none;
    padding: 0;
  }
  .services-dashboard li {
    margin-bottom: 1rem;
    padding: 0.75rem;
    background: rgba(255,255,255,0.03);
    border-radius: 4px;
    border-left: 2px solid rgba(255,255,255,0.2);
  }
  .services-dashboard li strong {
    display: block;
    margin-bottom: 0.25rem;
    color: #fff;
  }
  .services-dashboard pre {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: 1rem;
    font-size: 0.9rem;
  }
  .services-dashboard table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 1rem;
  }
  .services-dashboard th,
  .services-dashboard td {
    padding: 0.5rem;
    border: 1px solid rgba(255,255,255,0.1);
    text-align: left;
  }
  .services-dashboard th {
    background: rgba(255,255,255,0.05);
    font-weight: 600;
  }
</style>
{{ end }}
