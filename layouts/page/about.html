{{ define "main" }}
<div class="about-page">
  <header>
    <h1>{{ .Title }}</h1>
    <p>{{ .Description }}</p>
  </header>

  {{ .Content }}

  <footer>
    <p>이 페이지는 사람과 agents 모두가 읽을 수 있도록 설계되었습니다.</p>
  </footer>
</div>

<style>
  .about-page header {
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .about-page h1 {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
  }
  .about-page h2 {
    font-size: 1.3rem;
    margin-top: 2rem;
    margin-bottom: 1rem;
    color: rgba(255,255,255,0.9);
  }
  .about-page ul {
    list-style: none;
    padding: 0;
  }
  .about-page li {
    margin-bottom: 0.5rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .about-page pre {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: 1rem;
    font-size: 0.9rem;
  }
</style>
{{ end }}
