{{ define "main" }}
<div class="about-page">
  <header>
    <h1>{{ .Title }}</h1>
    <p class="description">{{ .Description }}</p>
  </header>

  {{ .Content }}

  <footer>
    <p>이 페이지는 사람과 agents 모두가 읽을 수 있도록 설계되었습니다.</p>
  </footer>
</div>

<style>
  .about-page {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    color: #333;
  }
  .about-page header {
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #eee;
  }
  .about-page h1 {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
    font-weight: 600;
  }
  .about-page .description {
    font-size: 1.1rem;
    color: #666;
  }
  .about-page h2 {
    font-size: 1.4rem;
    margin-top: 2rem;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid #007bff;
    color: #007bff;
    font-weight: 600;
  }
  .about-page ul {
    list-style: none;
    padding: 0;
  }
  .about-page li {
    margin-bottom: 0.5rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid #eee;
  }
  .about-page pre {
    line-height: 1.8;
    padding: 1.5rem;
    background: #f5f5f5;
    border-radius: 4px;
    overflow-x: auto;
    font-size: 0.9rem;
  }
  .about-page p {
    margin-bottom: 0.5rem;
  }
  .about-page footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid #eee;
    font-size: 0.9rem;
    color: #666;
  }
</style>
{{ end }}
